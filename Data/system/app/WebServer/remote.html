<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bluetooth Remote v2</title><style>
*{box-sizing:border-box}body{margin:0;background:#101827;color:#eaf2ff;font:15px system-ui}.wrap{max-width:1000px;margin:auto;padding:22px}h1{margin:10px 0 4px}p,label{color:#94a3b8}.tabs{display:flex;gap:8px;margin:18px 0}.tabs button.active{background:#2563eb}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin:14px 0}.card{background:#1e293b;padding:14px;border-radius:12px;border:1px solid #334155}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}label{display:block;margin-top:8px}input,select{width:100%;padding:9px;margin-top:4px;border:1px solid #475569;border-radius:8px;background:#0f172a;color:white}input[type=color]{padding:2px;height:38px}button,a{display:inline-block;border:0;border-radius:9px;padding:10px 16px;background:#334155;color:white;text-decoration:none;cursor:pointer}.save{background:#1976d2}#status{margin-left:12px;color:#93c5fd}
</style></head><body><div class="wrap"><a href="/dashboard.html">← Dashboard</a><h1>Bluetooth Remote v2</h1><p>3 profiluri × 12 butoane. Poți configura separat apăsarea scurtă și lungă, culoarea și iconul.</p><div id="tabs" class="tabs"></div><div id="grid" class="grid"></div><button class="save" onclick="save()">Salvează pe T-HMI</button><span id="status"></span></div><script>
const acts=[['Nimic','consumer',0,0],['Play / Pauză','consumer',205,0],['Următor','consumer',181,0],['Anterior','consumer',182,0],['Volum +','consumer',233,0],['Volum -','consumer',234,0],['Mute','consumer',226,0],['Stop','consumer',183,0],['Ctrl+C','keyboard',6,1],['Ctrl+V','keyboard',25,1],['Ctrl+X','keyboard',27,1],['Ctrl+Z','keyboard',29,1],['Ctrl+S','keyboard',22,1],['Alt+Tab','keyboard',43,4],['Enter','keyboard',40,0],['Delete','keyboard',76,0],['F5','keyboard',62,0]];
const icons=['settings','play','stop','prev','next','vol_down','mute','vol_up','home','back','mail','save','search','refresh','plus','close','up','down'];
const media=[['Anterior','prev',182],['Play / Pauza','play',205],['Urmator','next',181],['Volum -','vol_down',234],['Mute','mute',226],['Volum +','vol_up',233],['Stop','stop',183],['Home','home',547],['Back','back',548],['Calculator','settings',402],['Email','mail',394],['Browser','settings',406]];
function mk(name,type='consumer'){return{name,buttons:Array.from({length:12},(_,i)=>({label:'Buton '+(i+1),icon:'settings',color:'#2d3035',short:{type,code:0,modifier:0},long:{type,code:0,modifier:0}}))}}
let cfg={profiles:[mk('Media'),mk('Office','keyboard'),mk('Browser','keyboard')],page:0};media.forEach((x,i)=>Object.assign(cfg.profiles[0].buttons[i],{label:x[0],icon:x[1],short:{type:'consumer',code:x[2],modifier:0}}));
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function actionValue(a){let i=acts.findIndex(x=>x[1]==a.type&&x[2]==a.code&&x[3]==(a.modifier||0));return i<0?0:i}function actionSelect(id,a){return `<select id="${id}">${acts.map((x,i)=>`<option value="${i}" ${i==actionValue(a)?'selected':''}>${x[0]}</option>`).join('')}</select>`}
function draw(){tabs.innerHTML=cfg.profiles.map((p,i)=>`<button class="${i==cfg.page?'active':''}" onclick="read();cfg.page=${i};draw()">${esc(p.name)}</button>`).join('');grid.innerHTML='';cfg.profiles[cfg.page].buttons.forEach((b,i)=>{let c=document.createElement('div');c.className='card';c.innerHTML=`<b>Buton ${i+1}</b><div class="row"><label>Etichetă<input id="l${i}" value="${esc(b.label)}"></label><label>Culoare<input id="c${i}" type="color" value="${b.color}"></label></div><div class="row"><label>Icon<select id="i${i}">${icons.map(x=>`<option ${x==b.icon?'selected':''}>${x}</option>`).join('')}</select></label><label>Apăsare scurtă${actionSelect('s'+i,b.short)}</label></div><label>Apăsare lungă${actionSelect('g'+i,b.long)}</label>`;grid.append(c)})}
function getAction(id){let x=acts[+document.querySelector('#'+id).value];return{type:x[1],code:x[2],modifier:x[3]}}function read(){if(!grid.children.length)return;cfg.profiles[cfg.page].buttons.forEach((b,i)=>Object.assign(b,{label:document.querySelector('#l'+i).value.slice(0,24),color:document.querySelector('#c'+i).value,icon:document.querySelector('#i'+i).value,short:getAction('s'+i),long:getAction('g'+i)}))}
async function load(){try{let r=await fetch('/fs/download?path='+encodeURIComponent('/data/bluetooth_remote.json'));if(r.ok){let x=await r.json();if(x.profiles)cfg.profiles=x.profiles}}catch(e){}draw()}async function save(){read();status.textContent='Se salvează...';let r=await fetch('/fs/upload?path='+encodeURIComponent('/data/bluetooth_remote.json'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({version:2,profiles:cfg.profiles})});status.textContent=r.ok?'Salvat. Redeschide aplicația.':'Eroare la salvare'}load();
</script></body></html>
